name: Deploy to NCP Object Storage

on:
  push:
    branches: [main]
  schedule:
    # 매일 07:00 KST (UTC 22:00). 예약 발행된 글이 이때 공개됩니다.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ncp-object-storage
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install D2 renderer
        env:
          D2_VERSION: v0.7.1
        run: |
          archive="$RUNNER_TEMP/d2-$D2_VERSION-linux-amd64.tar.gz"
          install_dir="$RUNNER_TEMP/d2"
          curl -fsSL \
            "https://github.com/d2lang/d2/releases/download/$D2_VERSION/d2-$D2_VERSION-linux-amd64.tar.gz" \
            -o "$archive"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir/d2-$D2_VERSION/bin" >> "$GITHUB_PATH"
          "$install_dir/d2-$D2_VERSION/bin/d2" --version

      - name: Test D2 integration
        env:
          D2_BIN: d2
        run: npm run test:d2

      - name: Sync Notion posts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run sync:notion

      - name: Build static site
        run: npm run build:ncp

      - name: Upload to NCP Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NCP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NCP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: kr-standard
        run: |
          aws configure set request_checksum_calculation when_required
          aws configure set response_checksum_validation when_required

          aws s3 sync out s3://imjw-blog/ \
            --endpoint-url https://kr.object.ncloudstorage.com \
            --acl public-read \
            --delete \
            --only-show-errors

      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          echo "$response" | jq .

          if [ "$(echo "$response" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare 캐시 퍼지에 실패했습니다."
            exit 1
          fi
